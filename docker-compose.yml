version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db-sm
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sm
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: